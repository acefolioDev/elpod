apiVersion: apps/v1
kind: Deployment
metadata:
  name: elpod-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: elpod-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elpod-app
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: elpod-app
          image: elpod-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elpod-app
spec:
  selector:
    app.kubernetes.io/name: elpod-app
  ports:
    - name: http
      port: 80
      targetPort: http
