name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Check line limits
        run: bun run check:lines

      - name: Architecture seal
        run: bun run seal

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack smoke test
        run: bun run test:package
